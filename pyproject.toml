[project]
name = "dsg-compliance"
version = "0.1.0"
description = "RAG-grounded assistant for Swiss DSG (Datenschutzgesetz) compliance questions, citing the statute, ordinance, and FDPIC (EDOEB) guidance/decisions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "anthropic>=0.140",
    "chromadb>=0.5",
    "google-genai>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pypdf>=4.2",
    "click>=8.1",
    "PyYAML>=6.0",
    "openai>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock"]
# Automated citation-faithfulness checking (rag/faithfulness.py,
# `cli.py eval-faithfulness`) - kept as its own extra rather than a base
# dependency since it pulls in the whole langchain stack just to judge
# eval runs, not something the app needs to actually answer questions.
# langchain-community is pinned: ragas 0.4.3 imports
# langchain_community.chat_models.vertexai, which was moved/removed in
# langchain-community>=0.4, breaking `import ragas` outright.
eval = ["ragas>=0.4", "langchain-community==0.3.31"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
