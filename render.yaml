services:
  - type: web
    name: dsg-compliance
    runtime: python
    plan: free
    # Ingest runs at build time (once per deploy), not at startup, so a
    # free-tier sleep/wake cycle never re-fetches and re-embeds the corpus -
    # it just restarts uvicorn against the vector store the build produced.
    buildCommand: pip install -e . && python -m dsg_compliance.cli ingest
    startCommand: uvicorn dsg_compliance.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CHAT_PROVIDER
        value: glm
      - key: GLM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # CHROMA_PERSIST_DIR is left at its default (config.py resolves it
      # relative to the installed package's own location, which is correct
      # both locally and on Render - no override needed).
      - key: PYTHON_VERSION
        value: 3.12.6
