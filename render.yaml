services:
  - type: web
    name: dsg-compliance
    runtime: python
    plan: free
    # Ingest is NOT run at build/deploy time: Gemini's free-tier
    # embed_content quota is 1000 requests/day (counted per embedded text),
    # which a from-scratch ingest of this corpus (~3100 chunks) can't fit
    # in one day, and re-running it on every deploy would burn the day's
    # budget for no reason. data/chroma/ is committed instead - regenerate
    # locally with `dsg_compliance.cli ingest --max-chunks N` and recommit
    # if the source content changes.
    buildCommand: pip install -e .
    startCommand: uvicorn dsg_compliance.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CHAT_PROVIDER
        value: glm
      - key: GLM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # CHROMA_PERSIST_DIR is left at its default (config.py resolves it
      # relative to the installed package's own location, which is correct
      # both locally and on Render - no override needed).
      - key: PYTHON_VERSION
        value: 3.12.6
