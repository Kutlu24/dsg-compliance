<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swiss DSG Compliance Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4f8; --surface: #fff; --border: #e2e5ec; --text: #181c2a;
    --text2: #5b6172; --text3: #8e92a3;
    --accent: #d8232a; --accent-dark: #a5121b; --accent-soft: #fdecec;
    --ok: #16a34a; --ok-soft: #e3f8ea; --old: #b45309; --old-soft: #fef3c7;
    --shadow: 0 1px 2px rgba(24,28,42,.04), 0 8px 24px -12px rgba(24,28,42,.10);
    --shadow-sm: 0 1px 2px rgba(24,28,42,.06);
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Source Sans 3", -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font-body); background: var(--bg); color: var(--text); margin: 0; line-height: 1.55;
    background-image: radial-gradient(1100px 420px at 50% -180px, rgba(216,35,42,.06), transparent 70%);
  }
  .topbar { height: 5px; background: linear-gradient(90deg, var(--accent), var(--accent-dark)); }
  .layout {
    display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 820px) minmax(0, 260px);
    justify-content: center; align-items: start; gap: 28px; padding: 40px 24px 56px;
  }
  .wrap { padding: 0; }
  .side {
    position: sticky; top: 40px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px; box-shadow: var(--shadow);
  }
  .side h2 {
    font-family: var(--font-display); font-weight: 600; font-size: 0.98rem; margin: 0 0 4px;
  }
  .side .side-sub { font-size: 0.74rem; color: var(--text3); margin: 0 0 16px; }
  .side .empty { font-size: 0.8rem; color: var(--text3); }
  .timeline-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 0.72rem; }
  .timeline-row .yr { width: 32px; flex-shrink: 0; color: var(--text2); font-variant-numeric: tabular-nums; }
  .timeline-row .bars { flex: 1; display: flex; gap: 2px; height: 12px; }
  .timeline-row .bar-seg { border-radius: 2px; }
  .timeline-row .bar-seg.current { background: var(--ok); }
  .timeline-row .bar-seg.old { background: var(--old); }
  .timeline-legend { display: flex; gap: 14px; font-size: 0.7rem; color: var(--text2); margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .timeline-legend .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .prec-row { display: block; margin-bottom: 12px; text-decoration: none; border-radius: 6px; padding: 4px 6px; margin: -4px -6px 8px; transition: background .12s; }
  .prec-row:hover { background: var(--bg); }
  .prec-row:hover .prec-name span:first-child { color: var(--accent-dark); text-decoration: underline; }
  .prec-row .prec-name { font-family: var(--font-mono, monospace); font-size: 0.72rem; color: var(--text); font-weight: 600; display: flex; justify-content: space-between; margin-bottom: 4px; }
  .prec-row .prec-count { color: var(--accent-dark); font-weight: 700; }
  .prec-row .prec-bar-track { background: var(--bg); border-radius: 4px; height: 7px; overflow: hidden; }
  .prec-row .prec-bar-fill { background: linear-gradient(90deg, var(--accent), var(--accent-dark)); height: 100%; border-radius: 4px; }
  @media (max-width: 1180px) {
    .layout { grid-template-columns: 1fr; max-width: 820px; margin: 0 auto; }
    .side { position: static; }
  }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; margin-bottom: 4px; }
  .brand { display: flex; align-items: flex-start; gap: 14px; }
  .brand-mark {
    flex-shrink: 0; width: 40px; height: 40px; border-radius: 10px; background: var(--accent);
    display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm);
  }
  .brand-mark svg { width: 20px; height: 20px; }
  h1 {
    font-family: var(--font-display); font-weight: 600; font-size: 1.85rem; letter-spacing: -0.01em;
    margin: 0 0 6px; color: var(--text); text-wrap: balance;
  }
  .tagline {
    font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: 1rem;
    color: var(--accent-dark); margin: 0 0 10px;
  }
  .subtitle { color: var(--text2); margin: 0; max-width: 560px; font-size: 0.95rem; }
  .lang-toggle { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 3px; box-shadow: var(--shadow-sm); }
  .lang-toggle button { background: transparent; border: none; padding: 6px 14px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; color: var(--text2); font-family: inherit; }
  .lang-toggle button.active { background: var(--accent); color: #fff; }
  .model-badge {
    display: inline-flex; align-items: center; gap: 7px; font-size: 0.76rem; color: var(--text2);
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px;
    margin: 22px 0 22px; box-shadow: var(--shadow-sm);
  }
  .model-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; margin-bottom: 20px; box-shadow: var(--shadow); }
  label.field-label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
  textarea {
    width: 100%; min-height: 84px; padding: 13px 14px; border: 1px solid var(--border); border-radius: 10px;
    font-family: inherit; font-size: 0.95rem; resize: vertical; background: var(--bg); transition: border-color .15s, box-shadow .15s;
  }
  textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
  button.ask {
    background: var(--accent); color: #fff; border: none; padding: 11px 26px; border-radius: 8px; cursor: pointer;
    font-size: 0.9rem; font-weight: 700; margin-top: 14px; font-family: inherit; letter-spacing: 0.01em;
    box-shadow: 0 1px 2px rgba(165,18,27,.15); transition: background .15s, transform .1s;
  }
  button.ask:hover { background: var(--accent-dark); }
  button.ask:active { transform: translateY(1px); }
  button.ask:disabled { background: #c7cad4; cursor: not-allowed; box-shadow: none; }
  .status { font-size: 0.85rem; color: var(--text2); margin-top: 10px; min-height: 1.2em; }
  .answer-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 26px;
    box-shadow: var(--shadow); border-top: 3px solid var(--accent);
    animation: rise .35s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .answer-card { animation: none; } }
  .answer-text { white-space: pre-wrap; font-size: 0.97rem; margin-bottom: 22px; }
  .sources h3 { font-family: var(--font-display); font-weight: 600; font-size: 1rem; color: var(--text); margin-bottom: 12px; }
  .source-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px 0; border-top: 1px solid var(--border); font-size: 0.86rem; }
  .source-item:first-child { border-top: none; padding-top: 0; }
  .badge { flex-shrink: 0; font-size: 0.66rem; font-weight: 700; padding: 3px 9px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.03em; margin-top: 1px; }
  .badge-current { background: var(--ok-soft); color: var(--ok); }
  .badge-old { background: var(--old-soft); color: var(--old); }
  .source-item a { color: var(--text); text-decoration: none; font-weight: 600; }
  .source-item a:hover { color: var(--accent); text-decoration: underline; }
  .disclaimer { font-size: 0.78rem; color: var(--text3); font-style: italic; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border); }
  @media (max-width: 560px) {
    .wrap { padding: 28px 18px 40px; }
    h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<div class="topbar"></div>
<div class="layout">
<aside class="side" id="sideLeft">
  <h2 id="timelineTitle"></h2>
  <p class="side-sub" id="timelineSub"></p>
  <div id="timelineBody"><p class="empty">...</p></div>
  <div class="timeline-legend">
    <span><span class="sw" style="background:var(--ok)"></span><span id="legendCurrent"></span></span>
    <span><span class="sw" style="background:var(--old)"></span><span id="legendOld"></span></span>
  </div>
</aside>
<div class="wrap">
  <div class="top-row">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M11 2 3 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6l-8-4Z" fill="#fff" fill-opacity=".18"/>
          <path d="M11 2 3 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6l-8-4Z" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M11 8.4v6.2M7.9 11.5h6.2" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1>Swiss DSG Compliance Assistant</h1>
        <p class="tagline" id="tagline"></p>
        <p class="subtitle" id="subtitle"></p>
      </div>
    </div>
    <div class="lang-toggle">
      <button id="btnDe" onclick="setLang('de')">DE</button>
      <button id="btnEn" onclick="setLang('en')">EN</button>
    </div>
  </div>

  <div class="model-badge" id="modelBadge"><span class="dot"></span> ...</div>

  <div class="card">
    <label class="field-label" id="questionLabel" for="question"></label>
    <textarea id="question" placeholder=""></textarea>
    <br>
    <button class="ask" onclick="ask()" id="askBtn"></button>
    <div class="status" id="status"></div>
  </div>

  <div id="result"></div>
</div>
<aside class="side" id="sideRight">
  <h2 id="precedentsTitle"></h2>
  <p class="side-sub" id="precedentsSub"></p>
  <div id="precedentsBody"><p class="empty">...</p></div>
</aside>
</div>

<script>
const API = "";

const STRINGS = {
  de: {
    tagline: "Datenschutz mit Schweizer Präzision.",
    subtitle: "Stellen Sie eine Frage zum Schweizer Datenschutzgesetz (DSG). Jede Antwort ist mit Quellenangaben aus dem Gesetzestext (DSG/DSV) und EDÖB-Entscheiden belegt.",
    questionLabel: "Ihre Frage",
    placeholder: "z. B. \"Wie lange darf ich für die Beantwortung eines Auskunftsgesuchs brauchen?\"",
    ask: "Fragen",
    asking: "Wird beantwortet...",
    sources: "Quellen",
    disclaimer: "Dies ist eine Informationshilfe, keine Rechtsberatung. Für eine verbindliche Einschätzung konsultieren Sie eine Anwältin/einen Anwalt oder direkt den EDÖB.",
    model: "Aktives KI-Modell",
    current: "aktuell",
    old: "altes Recht",
    error: "Fehler: ",
    timelineTitle: "Entscheid-Zeitachse",
    timelineSub: "EDÖB-Entscheide pro Jahr",
    legendCurrent: "aktuelles Recht",
    legendOld: "altes Recht (aDSG)",
    precedentsTitle: "Meistzitierte Präjudizien",
    precedentsSub: "BGE-Urteile, auf die sich EDÖB-Entscheide stützen",
    precedentCitedBy: n => `zitiert von ${n} Entscheid${n === 1 ? "" : "en"}`,
    loading: "Lädt...",
  },
  en: {
    tagline: "Data protection, Swiss precision.",
    subtitle: "Ask a question about the Swiss Federal Data Protection Act (DSG). Every answer is grounded in citations from the statute text (DSG/DSV) and FDPIC decisions.",
    questionLabel: "Your question",
    placeholder: "e.g. \"How long do I have to respond to an access request?\"",
    ask: "Ask",
    asking: "Thinking...",
    sources: "Sources",
    disclaimer: "This is an informational aid, not legal advice. For a binding assessment, consult a lawyer or the FDPIC directly.",
    model: "Active AI model",
    current: "current",
    old: "old law",
    error: "Error: ",
    timelineTitle: "Decision timeline",
    timelineSub: "EDÖB decisions per year",
    legendCurrent: "current law",
    legendOld: "old law (aDSG)",
    precedentsTitle: "Most-cited precedents",
    precedentsSub: "Federal Court (BGE) rulings EDÖB decisions rely on",
    precedentCitedBy: n => `cited by ${n} decision${n === 1 ? "" : "s"}`,
    loading: "Loading...",
  },
};

let citationGraph = null;

let lang = "de";
let lastConfig = null;

function renderModelBadge() {
  if (!lastConfig) return;
  document.getElementById("modelBadge").innerHTML =
    `<span class="dot"></span> ${STRINGS[lang].model}: ${lastConfig.provider} / ${lastConfig.model}`;
}

function setLang(l) {
  lang = l;
  document.getElementById("btnDe").classList.toggle("active", l === "de");
  document.getElementById("btnEn").classList.toggle("active", l === "en");
  document.documentElement.lang = l;
  const s = STRINGS[l];
  document.getElementById("tagline").textContent = s.tagline;
  document.getElementById("subtitle").textContent = s.subtitle;
  document.getElementById("questionLabel").textContent = s.questionLabel;
  document.getElementById("question").placeholder = s.placeholder;
  document.getElementById("askBtn").textContent = s.ask;
  document.getElementById("timelineTitle").textContent = s.timelineTitle;
  document.getElementById("timelineSub").textContent = s.timelineSub;
  document.getElementById("legendCurrent").textContent = s.legendCurrent;
  document.getElementById("legendOld").textContent = s.legendOld;
  document.getElementById("precedentsTitle").textContent = s.precedentsTitle;
  document.getElementById("precedentsSub").textContent = s.precedentsSub;
  renderModelBadge();
  renderTimeline();
  renderPrecedents();
}

function renderTimeline() {
  const body = document.getElementById("timelineBody");
  if (!citationGraph) { body.innerHTML = `<p class="empty">${STRINGS[lang].loading}</p>`; return; }
  const byYear = {};
  for (const d of citationGraph.decisions) {
    if (!d.publication_date) continue;
    const year = d.publication_date.slice(0, 4);
    const isOld = d.law_version.toLowerCase().startsWith("adsg");
    byYear[year] = byYear[year] || { current: 0, old: 0 };
    byYear[year][isOld ? "old" : "current"]++;
  }
  const years = Object.keys(byYear).sort();
  if (!years.length) { body.innerHTML = `<p class="empty">-</p>`; return; }
  const maxCount = Math.max(...years.map(y => byYear[y].current + byYear[y].old));
  body.innerHTML = years.map(y => {
    const { current, old } = byYear[y];
    const total = current + old;
    const widthPct = (n) => `${(n / maxCount) * 100}%`;
    return `<div class="timeline-row">
      <span class="yr">${y}</span>
      <div class="bars">
        ${current ? `<div class="bar-seg current" style="width:${widthPct(current)}" title="${current}"></div>` : ""}
        ${old ? `<div class="bar-seg old" style="width:${widthPct(old)}" title="${old}"></div>` : ""}
      </div>
      <span style="color:var(--text3)">${total}</span>
    </div>`;
  }).join("");
}

function bgeLink(citation) {
  // "BGE 136 II 508" -> official Federal Supreme Court case-law viewer.
  // Verified live (2026-09) across old (BGE 95, 1969) and recent (BGE 142,
  // 2016) volumes - this is bger.ch's own redirect service, not a guess.
  const m = citation.match(/^BGE\s+(\d+)\s+([IVX]+)\s+(\d+)$/);
  if (!m) return null;
  return `http://relevancy.bger.ch/cgi-bin/JumpCGI?id=BGE-${m[1]}-${m[2]}-${m[3]}`;
}

function renderPrecedents() {
  const body = document.getElementById("precedentsBody");
  if (!citationGraph) { body.innerHTML = `<p class="empty">${STRINGS[lang].loading}</p>`; return; }
  const entries = Object.entries(citationGraph.bge_frequency).sort((a, b) => b[1] - a[1]).slice(0, 10);
  if (!entries.length) { body.innerHTML = `<p class="empty">-</p>`; return; }
  const maxN = entries[0][1];
  body.innerHTML = entries.map(([name, n]) => `
    <a class="prec-row" href="${bgeLink(name)}" target="_blank" rel="noopener" title="${STRINGS[lang].precedentCitedBy(n)}">
      <div class="prec-name"><span>${name}</span><span class="prec-count">${n}</span></div>
      <div class="prec-bar-track"><div class="prec-bar-fill" style="width:${(n / maxN) * 100}%"></div></div>
    </a>`).join("");
}

async function loadCitationGraph() {
  try {
    citationGraph = await (await fetch(`${API}/citation-graph`)).json();
  } catch {
    citationGraph = { decisions: [], bge_frequency: {} };
  }
  renderTimeline();
  renderPrecedents();
}

async function errorText(res) {
  try {
    const body = await res.json();
    return body.detail || JSON.stringify(body);
  } catch {
    return await res.text();
  }
}

async function loadConfig() {
  try {
    lastConfig = await (await fetch(`${API}/config`)).json();
    renderModelBadge();
  } catch {
    document.getElementById("modelBadge").textContent = "";
  }
}

function sourceBadge(lawVersion) {
  const isOld = lawVersion.toLowerCase().startsWith("adsg");
  const label = isOld ? STRINGS[lang].old : STRINGS[lang].current;
  return `<span class="badge ${isOld ? 'badge-old' : 'badge-current'}">${label}</span>`;
}

async function ask() {
  const question = document.getElementById("question").value.trim();
  if (!question) return;
  const s = STRINGS[lang];
  const statusEl = document.getElementById("status");
  const btn = document.getElementById("askBtn");
  btn.disabled = true;
  statusEl.textContent = s.asking;
  document.getElementById("result").innerHTML = "";

  try {
    const res = await fetch(`${API}/ask`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, lang }),
    });
    if (!res.ok) {
      statusEl.textContent = s.error + await errorText(res);
      return;
    }
    const data = await res.json();
    statusEl.textContent = "";
    const sourcesHtml = data.sources.map(src => `
      <div class="source-item">
        ${sourceBadge(src.law_version)}
        <a href="${src.source_url}" target="_blank" rel="noopener">${src.label}</a>
      </div>`).join("");
    document.getElementById("result").innerHTML = `
      <div class="answer-card">
        <div class="answer-text">${data.answer.replace(/</g, "&lt;")}</div>
        <div class="sources">
          <h3>${s.sources}</h3>
          ${sourcesHtml}
        </div>
        <div class="disclaimer">${s.disclaimer}</div>
      </div>`;
  } finally {
    btn.disabled = false;
  }
}

setLang("de");
loadConfig();
loadCitationGraph();
</script>
</body>
</html>
