<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSG Compliance</title>
<style>
  :root {
    --bg: #f7f8fa; --surface: #fff; --border: #e2e5ea; --text: #1c2230;
    --text2: #667085; --accent: #b91c2b; --accent-dark: #8f1420;
    --ok: #16a34a; --old: #b45309;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 32px; line-height: 1.5; }
  .wrap { max-width: 820px; margin: 0 auto; }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .subtitle { color: var(--text2); margin-bottom: 20px; max-width: 640px; }
  .lang-toggle { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
  .lang-toggle button { background: transparent; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; color: var(--text2); }
  .lang-toggle button.active { background: var(--accent); color: #fff; }
  .model-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text2); background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; margin-bottom: 20px; }
  .model-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  textarea { width: 100%; min-height: 80px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 0.95rem; resize: vertical; }
  button.ask { background: var(--accent); color: #fff; border: none; padding: 10px 22px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 600; margin-top: 12px; }
  button.ask:hover { background: var(--accent-dark); }
  button.ask:disabled { background: #cbd2dc; cursor: not-allowed; }
  .status { font-size: 0.85rem; color: var(--text2); margin-top: 10px; min-height: 1.2em; }
  .answer-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; }
  .answer-text { white-space: pre-wrap; font-size: 0.95rem; margin-bottom: 20px; }
  .sources h3 { font-size: 0.85rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 10px; }
  .source-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); font-size: 0.85rem; }
  .source-item:first-child { border-top: none; }
  .badge { flex-shrink: 0; font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.02em; }
  .badge-current { background: #dcfce7; color: var(--ok); }
  .badge-old { background: #fef3c7; color: var(--old); }
  .source-item a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .source-item a:hover { text-decoration: underline; }
  .disclaimer { font-size: 0.78rem; color: var(--text2); font-style: italic; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-row">
    <div>
      <h1>DSG Compliance</h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
    <div class="lang-toggle">
      <button id="btnDe" onclick="setLang('de')">DE</button>
      <button id="btnEn" onclick="setLang('en')">EN</button>
    </div>
  </div>

  <div class="model-badge" id="modelBadge"><span class="dot"></span> ...</div>

  <div class="card">
    <textarea id="question" placeholder=""></textarea>
    <br>
    <button class="ask" onclick="ask()" id="askBtn"></button>
    <div class="status" id="status"></div>
  </div>

  <div id="result"></div>
</div>

<script>
const API = "";

const STRINGS = {
  de: {
    subtitle: "Stellen Sie eine Frage zum Schweizer Datenschutzgesetz (DSG). Jede Antwort ist mit Quellenangaben aus dem Gesetzestext (DSG/DSV) und EDÖB-Entscheiden belegt.",
    placeholder: "Ihre Frage zum DSG, z. B. \"Wie lange darf ich für die Beantwortung eines Auskunftsgesuchs brauchen?\"",
    ask: "Fragen",
    asking: "Wird beantwortet...",
    sources: "Quellen",
    disclaimer: "Dies ist eine Informationshilfe, keine Rechtsberatung. Für eine verbindliche Einschätzung konsultieren Sie eine Anwältin/einen Anwalt oder direkt den EDÖB.",
    model: "Aktives KI-Modell",
    current: "aktuell",
    old: "altes Recht",
    error: "Fehler: ",
  },
  en: {
    subtitle: "Ask a question about the Swiss Federal Data Protection Act (DSG). Every answer is grounded in citations from the statute text (DSG/DSV) and FDPIC decisions.",
    placeholder: "Your question about the DSG, e.g. \"How long do I have to respond to an access request?\"",
    ask: "Ask",
    asking: "Thinking...",
    sources: "Sources",
    disclaimer: "This is an informational aid, not legal advice. For a binding assessment, consult a lawyer or the FDPIC directly.",
    model: "Active AI model",
    current: "current",
    old: "old law",
    error: "Error: ",
  },
};

let lang = "de";
let lastConfig = null;

function renderModelBadge() {
  if (!lastConfig) return;
  document.getElementById("modelBadge").innerHTML =
    `<span class="dot"></span> ${STRINGS[lang].model}: ${lastConfig.provider} / ${lastConfig.model}`;
}

function setLang(l) {
  lang = l;
  document.getElementById("btnDe").classList.toggle("active", l === "de");
  document.getElementById("btnEn").classList.toggle("active", l === "en");
  document.documentElement.lang = l;
  const s = STRINGS[l];
  document.getElementById("subtitle").textContent = s.subtitle;
  document.getElementById("question").placeholder = s.placeholder;
  document.getElementById("askBtn").textContent = s.ask;
  renderModelBadge();
}

async function errorText(res) {
  try {
    const body = await res.json();
    return body.detail || JSON.stringify(body);
  } catch {
    return await res.text();
  }
}

async function loadConfig() {
  try {
    lastConfig = await (await fetch(`${API}/config`)).json();
    renderModelBadge();
  } catch {
    document.getElementById("modelBadge").textContent = "";
  }
}

function sourceBadge(lawVersion) {
  const isOld = lawVersion.toLowerCase().startsWith("adsg");
  const label = isOld ? STRINGS[lang].old : STRINGS[lang].current;
  return `<span class="badge ${isOld ? 'badge-old' : 'badge-current'}">${label}</span>`;
}

async function ask() {
  const question = document.getElementById("question").value.trim();
  if (!question) return;
  const s = STRINGS[lang];
  const statusEl = document.getElementById("status");
  const btn = document.getElementById("askBtn");
  btn.disabled = true;
  statusEl.textContent = s.asking;
  document.getElementById("result").innerHTML = "";

  try {
    const res = await fetch(`${API}/ask`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    if (!res.ok) {
      statusEl.textContent = s.error + await errorText(res);
      return;
    }
    const data = await res.json();
    statusEl.textContent = "";
    const sourcesHtml = data.sources.map(src => `
      <div class="source-item">
        ${sourceBadge(src.law_version)}
        <a href="${src.source_url}" target="_blank" rel="noopener">${src.label}</a>
      </div>`).join("");
    document.getElementById("result").innerHTML = `
      <div class="answer-card">
        <div class="answer-text">${data.answer.replace(/</g, "&lt;")}</div>
        <div class="sources">
          <h3>${s.sources}</h3>
          ${sourcesHtml}
        </div>
        <div class="disclaimer">${s.disclaimer}</div>
      </div>`;
  } finally {
    btn.disabled = false;
  }
}

setLang("de");
loadConfig();
</script>
</body>
</html>
